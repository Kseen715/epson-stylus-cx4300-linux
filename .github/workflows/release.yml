name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time: two in parallel would compute the same next tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...

  # The tag is decided before anything is built, because it is part of every
  # file name the build produces.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, so today's releases can be counted
      - name: Pick the next vYYYYMMDD.N tag
        id: tag
        run: |
          date="v$(date -u +%Y%m%d)"
          # Highest N already used today, 0 when today has no release yet.
          n=$(git tag --list "${date}.*" \
              | sed "s/^${date}\.//" \
              | grep -E '^[0-9]+$' \
              | sort -n | tail -1)
          tag="${date}.$(( ${n:-0} + 1 ))"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "next release: ${tag}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `label` is what users see in the file name; goarch is what Go calls it.
          - {label: x86_64,  goarch: amd64}
          - {label: x86,     goarch: '386'}
          - {label: aarch64, goarch: arm64}
          - {label: armv7,   goarch: arm,    goarm: '7'}
          - {label: mips,    goarch: mips,   gomips: softfloat}
          - {label: mipsel,  goarch: mipsle, gomips: softfloat}
          - {label: riscv64, goarch: riscv64}
    env:
      # escan-<tag>-<platform>-<arch>, the name used from here to the release.
      NAME: escan-${{ needs.version.outputs.tag }}-linux-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # No cgo anywhere in the tree, so CGO_ENABLED=0 yields a static binary
      # with no libc of its own: the same file runs on glibc and musl systems.
      - name: Build escan
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags '-s -w' \
            -o "dist/${NAME}" ./cmd/escan
          file "dist/${NAME}"

      - name: Package .run installer
        run: scripts/make-run.sh "dist/${NAME}" "${{ matrix.label }}" "dist/${NAME}.run"

      - name: Checksums
        run: cd dist && sha256sum "${NAME}" "${NAME}.run" > "${NAME}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    # Pushes to master and manual runs cut a release; pull requests stop at the
    # artifacts above.
    if: github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums into one file
        run: cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS && rm -f dist/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            Static binaries, no libc dependency: each build runs on glibc and
            musl systems alike, and needs no libusb, SANE or Python.

            `escan-${{ needs.version.outputs.tag }}-linux-<arch>` is the bare
            executable. The `.run` beside it is a self-extracting installer that
            also writes the udev rule and disables the epkowa SANE backend:

                chmod +x escan-${{ needs.version.outputs.tag }}-linux-x86_64.run
                sudo ./escan-${{ needs.version.outputs.tag }}-linux-x86_64.run    # --service for systemd
