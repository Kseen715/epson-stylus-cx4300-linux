# escan configuration - installed as /etc/escan.conf.
#
# One "key = value" per line; # starts a comment. Every key here is also a
# command-line flag, and a flag given on the command line wins over this file.
# The file is only read if it exists, so escan still runs with no config at all.
#
# This file holds a password: keep it mode 0600, owned by the user escan runs
# as. escan refuses to use SMB credentials from a file others can read.

# Listen address. With no auth-user/auth-password set below, escan asks for no
# login at all, so anything that can reach this address can scan and can
# download everything in the output directory - widen it past localhost only on
# a network you trust, and set a login first.
# addr = 127.0.0.1:8080

# Where finished scans go. Ignored when smb-address is set.
# out = /home/you/scans

# preview-dpi  = 75
# scan-dpi     = 300

# Scan in grey rather than colour by default. The device only ever scans
# colour; grey is its luma average, which suits text, writes a third of the
# file, and removes the colour speckle a grey original otherwise picks up. The
# page's Mode buttons override it per scan.
# gray = false

# Below 300 dpi, scan at 300 and average down. The sensor's three colour planes
# read different rows, and under 300 dpi the device subsamples rather than
# averaging, so thin lines come out fringed with colour. This removes it, at the
# cost of the 300 dpi sweep's time. No effect at 300 dpi or above, and previews
# never oversample.
# oversample = true
# preview-max  = 900
# display-max  = 1600

# Where this scanner's measured colour plane alignment is read from, as written
# by "escan calibrate". The built-in values are used if it does not exist.
# calibration = /etc/escan-calibration.json

# --- Login ------------------------------------------------------------------
#
# Set both of these and escan serves a login page and refuses every request
# without a valid token. Set neither and it runs open, as it always has. There
# is one account; that is the whole model.
#
# auth-user     = you
# auth-password = secret

# How long a login lasts. Signing in issues two tokens: a short-lived one that
# every request carries, and a long-lived one that silently renews it, so a
# leaked token goes stale quickly while the browser stays signed in.
# auth-ttl         = 15m
# auth-refresh-ttl = 8760h

# Key the tokens are signed with, as hex, at least 32 bytes. Leave it unset and
# escan generates one at startup, which logs everyone out whenever it restarts.
# Set it to keep logins across restarts:
#   openssl rand -hex 32
# jwt-secret = 0123456789abcdef...

# --- Writing scans straight to an SMB/Samba share ---------------------------
#
# With smb-address set, escan talks SMB itself: nothing is mounted, no root is
# needed, and no cifs-utils. Scans are written to the share and the Download
# link reads them back from it.
#
# The address is //host/share, optionally with a subdirectory and a port. The
# subdirectory must already exist on the share.
#
# smb-address  = //nas.lan/scans
# smb-address  = //nas.lan:445/scans/cx4300
# smb-user     = scanuser
# smb-password = secret
# smb-domain   = WORKGROUP
